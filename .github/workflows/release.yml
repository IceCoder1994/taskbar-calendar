name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build self-contained single file
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish src/TaskbarCalendar/TaskbarCalendar.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None -p:DebugSymbols=false `
            -p:Version=$version `
            -o dist

      - name: Package zip
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Copy-Item "docs/使用说明.txt" "dist/使用说明.txt" -Force
          Compress-Archive -Path 'dist/*' -DestinationPath "TaskbarCalendar-$tag-win-x64.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: TaskbarCalendar-*-win-x64.zip
          generate_release_notes: true
